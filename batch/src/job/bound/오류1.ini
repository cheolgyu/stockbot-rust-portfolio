select * from hist.bound where code_id=1901 and line='CLOSE' order by p1X DESC limit 10;

SELECT C.ID
    ,C.EXCHANGE
    ,COALESCE(MAX(CASE WHEN LINE = 'CLOSE' THEN P1X END), '1970-01-01') AS  close
    ,COALESCE(MAX(CASE WHEN LINE = 'OPEN' THEN P1X END), '1970-01-01') AS   open
    ,COALESCE(MAX(CASE WHEN LINE = 'LOW' THEN P1X END), '1970-01-01') AS    low
    ,COALESCE(MAX(CASE WHEN LINE = 'HIGH' THEN P1X END), '1970-01-01') AS   high
FROM  CODE C  LEFT JOIN HIST.BOUND H ON C.ID = H.CODE_ID
	where id =1901
GROUP BY C.ID ORDER BY C.ID ASC
