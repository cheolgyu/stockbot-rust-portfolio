name: batch_exe

on:
  push:
    branches: [ "main" ]
    paths:
      - 'batch_exe/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  DOCKERFILE: batch_exe/dockerfile
  CODEDEPLOY_SCRIPT: aws/codedeploy/batch_exe/run.sh
  CODEDEPLOY_APPSPEC: aws/codedeploy/batch_exe/appspec.yml
  PROJECT: batch_exe
  REGION: ap-northeast-2
  BUCKET_NM: example-stockbot-deploy
  REGISTRY: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com
  REPOSITORY: stockbot/batch_exe
  CACHE_BUCKET: example-stockbot-cache
  SCCACHE_S3_KEY_PREFIX: sccache/

jobs:
  docker:
    name: CI/CD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - 
        name: AWS configure credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.SECRET_KEY }}
          aws-region: ${{env.REGION}}
        
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/arm64
      -
        name: Build and push Docker image for ARM64
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64 
          context: .
          push: true
          build-args: |
            AWS_ACCESS_KEY_ID=${{ secrets.ACCESS_KEY }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.SECRET_KEY }}
            SCCACHE_BUCKET=${{env.CACHE_BUCKET}}
            SCCACHE_S3_KEY_PREFIX=${{env.SCCACHE_S3_KEY_PREFIX}}
            SCCACHE_REGION=${{env.REGION}}
          cache-from: type=s3,region=${{env.REGION}},bucket=${{env.CACHE_BUCKET}},name=${{env.PROJECT}}-docker-cache
          cache-to: type=s3,region=${{env.REGION}},bucket=${{env.CACHE_BUCKET}},name=${{env.PROJECT}}-docker-cache
          file:  ${{env.DOCKERFILE}}
          tags: |
            ${{env.REGISTRY}}/${{env.REPOSITORY}}:latest 
            ${{env.REGISTRY}}/${{env.REPOSITORY}}:${{github.sha}}
      - 
        name: mv
        run: | 
          mv ${{env.CODEDEPLOY_SCRIPT}} run.sh && \
          mv ${{env.CODEDEPLOY_APPSPEC}} appspec.yml && \
          tar -zcvf deploy.tar.gz run.sh appspec.yml .env.prod
      - 
        name: Upload to S3
        run: aws s3 cp --region ${{env.REGION}} --acl private  deploy.tar.gz s3://${{env.BUCKET_NM}}/${{env.PROJECT}}/ 
      - 
        name: deploy with AWS codeDeploy
        run: aws deploy create-deployment
          --application-name stockbot-site-api
          --deployment-config-name CodeDeployDefault.OneAtATime
          --deployment-group-name batch_exe
          --s3-location bucket=${{env.BUCKET_NM}},bundleType=tgz,key=${{env.PROJECT}}/deploy.tar.gz      