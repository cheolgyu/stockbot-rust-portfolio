name: site

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  DOCKERFILE: site/dockerfile
  PROJECT: site
  REGION: ap-northeast-2
  BUCKET_NM: example-stockbot-site
  REGISTRY: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com
  REPOSITORY: stockbot-site
  CACHE_BUCKET: example-stockbot-cache
  SCCACHE_S3_KEY_PREFIX: sccache/

jobs:
  docker:
    name: CI/CD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Load .env file
        uses: xom9ikk/dotenv@v2
        with:
          mode: prod
      - name: AWS configure credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.SECRET_KEY }}
          aws-region: ${{env.REGION}}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1
      - name: build buildx prod image
        run: |
          docker buildx build \
          --load  \
          --build-arg AWS_ACCESS_KEY_ID=${{ secrets.ACCESS_KEY }}  \
          --build-arg AWS_SECRET_ACCESS_KEY=${{ secrets.SECRET_KEY }}  \
          --build-arg SCCACHE_BUCKET=${{env.CACHE_BUCKET}}  \
          --build-arg SCCACHE_S3_KEY_PREFIX=${{env.SCCACHE_S3_KEY_PREFIX}}  \
          --build-arg SCCACHE_REGION=${{env.REGION}}  \
          --build-arg BACKEND_ADDR=${{env.BACKEND_ADDR}}  \
          --cache-from=type=s3,region=${{env.REGION}},bucket=${{env.CACHE_BUCKET}},name=${{env.PROJECT}}-docker-cache \
          --cache-to=type=s3,region=${{env.REGION}},bucket=${{env.CACHE_BUCKET}},name=${{env.PROJECT}}-docker-cache \
          -f  ${{env.DOCKERFILE}}   \
          -t ${{env.REGISTRY}}/${{env.REPOSITORY}}:latest     \
           .
      - name: list
        run: docker images

      - uses: shrink/actions-docker-extract@v2
        id: extract
        with:
          image: ${{env.REGISTRY}}/${{env.REPOSITORY}}:latest
          path: /stockbot/site/dist/.

      - name: list
        run: ls ${{ steps.extract.outputs.destination }}
      - name: clean S3
        run: aws s3 rm --recursive  --region ${{env.REGION}} s3://${{env.BUCKET_NM}}
      - name: Upload to S3
        run: aws s3 cp --recursive --region ${{env.REGION}} ${{ steps.extract.outputs.destination }} s3://${{env.BUCKET_NM}}
