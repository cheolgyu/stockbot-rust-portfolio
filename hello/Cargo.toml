[package]
name = "hello"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
#utils = { path = "../utils", features = ["cmd"] }
tokio = { version = "1.27.0", features = ["full"] }
hyper = { version = "0.14", features = ["client"] }
hyper-tls = "0.5.0"
#openssl-sys = { version = "0.9", optional = true, features = ["vendored"] }

reqwest = "0.11.18"
trust-dns-resolver = "0.22.0"


[target.'cfg(unix)'.dependencies]
openssl = { version = '0.10', features = ["vendored"] }

[features]
# default = ["reqwest/default-tls", "trust-dns-resolver/dns-over-native-tls"]
# vendored-openssl = ["openssl/vendored"]
rustls = ["reqwest/rustls-tls", "trust-dns-resolver/dns-over-rustls"]

# vendored-openssl = ["openssl/vendored"]
